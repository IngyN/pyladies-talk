[project]
name = "pyladies"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ingy ElSayed-Aly", email = "10338556+IngyN@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "gymnasium[box2d]>=1.3.0",
    "huggingface-sb3>=3.0",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "rich>=15.0.0",
    "stable-baselines3>=2.9.0",
    "tqdm>=4.70.1",
    "transformers>=4.57.6",
    "trl>=1.14.0",
]

[project.scripts]
pyladies = "pyladies:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
